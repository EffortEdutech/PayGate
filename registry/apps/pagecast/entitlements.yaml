schema_version: "1.0"
entitlements:
  - key: pagecast.cast_pass
    description: Allows active Cast Pass membership access once pageCast reads PayGate entitlements.
  - key: pagecast.premium_casts
    description: Allows access to premium casts covered by Cast Pass membership.
  - key: pagecast.single_cast_unlock
    description: Allows one verified Single Cast purchase to unlock the scoped book only.
  - key: pagecast.cast.unlock
    description: Historical placeholder key retained for compatibility; new Single Cast items use pagecast.single_cast_unlock.
  - key: pagecast.bundle.unlock
    description: Allows one verified bundle purchase to unlock only the scoped bundle books.
